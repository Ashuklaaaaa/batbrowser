<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120" fill="none" role="img" aria-label="BatBrowser">
  <title>BatBrowser</title>
  <!--
    ═══════════════════════════════════════════════════════════════
    BatBrowser — CANONICAL LOGO SVG
    ═══════════════════════════════════════════════════════════════

    This is the master logo definition.
    The path data in this file is the PERMANENT BRAND SHAPE.

    DO NOT modify:  path data, aspect ratio, proportions
    YOU MAY change: fill color (using only brand palette colors)

    Canonical brand color: #00D4B4  (BatBrowser Teal)

    ViewBox: 0 0 200 120
    Shape description:
      - Bat silhouette with wide wings sweeping upward
      - Wings span nearly full width (8px to 192px)
      - Wings peak at y=20 (near top of viewBox)
      - Center body: narrow trapezoid from y=40 to y=72
      - Body peak (head): x=100, y=12
      - Tail nub: descends to y=90

    ═══════════════════════════════════════════════════════════════
  -->
  <path
    id="bat-canonical"
    d="M100,90 L85,72 L60,58 C40,48 18,36 8,20 C28,30 50,38 72,40 L88,52 L88,44 C88,30 92,20 100,12 C108,20 112,30 112,44 L112,52 L128,40 C150,38 172,30 192,20 C182,36 160,48 140,58 L115,72 Z"
    fill="#00D4B4"
  />
</svg>
