<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300" role="img" aria-label="BatBrowser splash screen">
  <title>BatBrowser</title>
  <!--
    BatBrowser — Splash Screen / Large Display Version
    Usage: App loading screen, About page, marketing
    Background: deep NOCTURNE abyss with subtle radial glow
    SHAPE IS CANONICAL — DO NOT MODIFY PATH DATA
  -->
  <defs>
    <!-- Subtle radial glow behind the bat -->
    <radialGradient id="glow" cx="50%" cy="50%" r="40%">
      <stop offset="0%"   stop-color="#00D4B4" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#00D4B4" stop-opacity="0"/>
    </radialGradient>
    <!-- Optional subtle vignette -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="60%"  stop-color="#080A0F" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.7"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="480" height="300" fill="#080A0F"/>

  <!-- Radial glow -->
  <ellipse cx="240" cy="140" rx="180" ry="110" fill="url(#glow)"/>

  <!-- The bat — scaled to occupy prominent center -->
  <!-- Original viewBox: 200×120. Scale: 2.0× → 400×240. Centered in 480×300 → translate(40, 30) -->
  <g transform="translate(40, 30) scale(2.0, 2.0)">
    <path
      d="M100,90 L85,72 L60,58 C40,48 18,36 8,20 C28,30 50,38 72,40 L88,52 L88,44 C88,30 92,20 100,12 C108,20 112,30 112,44 L112,52 L128,40 C150,38 172,30 192,20 C182,36 160,48 140,58 L115,72 Z"
      fill="#00D4B4"
    />
  </g>

  <!-- Vignette overlay -->
  <rect width="480" height="300" fill="url(#vignette)"/>

  <!-- Wordmark below -->
  <text
    x="240" y="268"
    font-family="'Inter', 'Segoe UI', system-ui, sans-serif"
    font-size="18"
    font-weight="300"
    letter-spacing="6"
    fill="#FFFFFF"
    fill-opacity="0.6"
    text-anchor="middle"
  >BATBROWSER</text>
</svg>
