<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https:;">
  <title>History — BatBrowser</title>
  <link rel="icon" type="image/svg+xml" href="../../shared/logo-favicon.svg">
  <link rel="stylesheet" href="../../shared/tokens.css">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: var(--bg); color: var(--text); font-family: var(--font-sans); -webkit-font-smoothing: antialiased; min-height: 100vh; }
    button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
    input  { font-family: inherit; }

    .page { max-width: 820px; margin: 0 auto; padding: 48px 32px; }

    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 32px;
      flex-wrap: wrap;
    }

    .page-title {
      font-size: var(--text-2xl);
      font-weight: var(--weight-semibold);
      letter-spacing: var(--tracking-tight);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .page-title svg { width: 24px; height: 24px; fill: var(--accent); }

    .header-actions { display: flex; align-items: center; gap: 10px; }

    .search-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--surface-1);
      border: 1px solid var(--border-dim);
      border-radius: var(--radius-lg);
      padding: 9px 14px;
      width: 280px;
      transition: border-color var(--dur-fast) var(--ease), width var(--dur-normal) var(--ease);
    }

    .search-bar:focus-within { border-color: var(--border-focus); width: 320px; }
    .search-bar svg { width: 15px; height: 15px; fill: var(--text-muted); flex-shrink: 0; }
    .search-input { background: none; border: none; outline: none; font-size: var(--text-sm); color: var(--text); width: 100%; }
    .search-input::placeholder { color: var(--text-muted); }

    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 14px; border-radius: var(--radius); font-size: var(--text-sm);
      font-weight: var(--weight-medium); cursor: pointer; font-family: inherit; border: none;
      transition: background var(--dur-micro) var(--ease), transform var(--dur-fast) var(--ease-spring);
    }
    .btn:active { transform: scale(0.97); }
    .btn svg { width: 14px; height: 14px; fill: currentColor; }
    .btn-ghost { background: none; color: var(--text-muted); }
    .btn-ghost:hover { background: var(--surface-hover); color: var(--text); }
    .btn-danger { background: var(--danger-dim); color: var(--danger); border: 1px solid rgba(232,85,85,0.2); }
    .btn-danger:hover { background: rgba(232,85,85,0.2); }

    /* ── Groups ── */
    .day-group { margin-bottom: 28px; }

    .day-label {
      font-size: var(--text-xs);
      font-weight: var(--weight-semibold);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
      padding: 0 4px;
      margin-bottom: 8px;
    }

    /* ── History Item ── */
    .history-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      border-radius: var(--radius);
      cursor: pointer;
      transition: background var(--dur-micro) var(--ease);
      position: relative;
      group: true;
    }

    .history-item:hover { background: var(--surface-1); }

    .item-favicon {
      width: 16px; height: 16px;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
    }

    .item-favicon img { width: 14px; height: 14px; object-fit: contain; border-radius: 2px; }
    .item-favicon svg { width: 14px; height: 14px; fill: var(--text-muted); opacity: 0.5; }

    .item-info { flex: 1; min-width: 0; }

    .item-title {
      font-size: var(--text-sm);
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 1px;
    }

    .item-url {
      font-size: var(--text-xs);
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .item-time {
      font-size: var(--text-xs);
      color: var(--text-muted);
      flex-shrink: 0;
      font-variant-numeric: tabular-nums;
    }

    .item-delete {
      width: 28px; height: 28px;
      border-radius: var(--radius-xs);
      display: flex; align-items: center; justify-content: center;
      opacity: 0;
      transition: opacity var(--dur-fast) var(--ease), background var(--dur-micro) var(--ease);
      color: var(--text-muted);
      flex-shrink: 0;
    }

    .history-item:hover .item-delete { opacity: 1; }
    .item-delete:hover { background: var(--danger-dim); color: var(--danger); }
    .item-delete svg { width: 14px; height: 14px; fill: currentColor; pointer-events: none; }

    /* ── Empty State ── */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 80px 32px;
      text-align: center;
    }

    .empty-icon {
      width: 56px; height: 56px;
      background: var(--surface-1);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
    }

    .empty-icon svg { width: 28px; height: 28px; fill: var(--text-muted); opacity: 0.5; }
    .empty-title { font-size: var(--text-lg); font-weight: var(--weight-medium); color: var(--text); }
    .empty-desc { font-size: var(--text-sm); color: var(--text-muted); }

    /* ── Loading ── */
    .history-skeleton {
      display: flex; align-items: center; gap: 12px; padding: 10px 14px;
    }

    .skeleton {
      background: var(--surface-1);
      border-radius: var(--radius);
      animation: skeleton-pulse 1.5s ease-in-out infinite;
    }

    @keyframes skeleton-pulse { 0%,100% { opacity: 0.4; } 50% { opacity: 0.7; } }
  </style>
</head>
<body>
<div class="page">
  <div class="page-header">
    <h1 class="page-title">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 3a9 9 0 0 0-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42A8.954 8.954 0 0 0 13 21a9 9 0 0 0 0-18zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/></svg>
      History
    </h1>

    <div class="header-actions">
      <div class="search-bar" role="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        <input type="search" class="search-input" id="search-input" placeholder="Search history…" aria-label="Search history" autocomplete="off">
      </div>
      <button class="btn btn-danger" id="clear-btn" onclick="clearHistory()">
        <svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
        Clear All
      </button>
    </div>
  </div>

  <div id="history-container">
    <!-- Skeleton while loading -->
    <div id="loading-skeletons">
      <div class="day-label skeleton" style="width:80px;height:12px;margin-bottom:12px;"></div>
      ${[1,2,3,4,5].map(() => `
        <div class="history-skeleton">
          <div class="skeleton" style="width:16px;height:16px;border-radius:4px;flex-shrink:0;"></div>
          <div style="flex:1">
            <div class="skeleton" style="width:60%;height:13px;margin-bottom:4px;"></div>
            <div class="skeleton" style="width:40%;height:11px;"></div>
          </div>
          <div class="skeleton" style="width:40px;height:11px;"></div>
        </div>
      `).join('')}
    </div>
  </div>
</div>

<script>
'use strict';
const bb = window.batBrowser;

let _allItems = [];
let _searchTimer = null;

async function loadHistory() {
  if (!bb) { renderEmpty('No browsing data found.'); return; }
  try {
    const items = await bb.history.get(2000);
    _allItems = items || [];
    render(_allItems);
  } catch (e) {
    renderEmpty('Could not load history.');
  }
}

function render(items) {
  const container = document.getElementById('history-container');
  container.innerHTML = '';

  if (!items || items.length === 0) {
    renderEmpty('No history found.');
    return;
  }

  // Group by date
  const groups = new Map();
  items.forEach(item => {
    const d = new Date(item.visitedAt || item.timestamp || Date.now());
    const label = getDateLabel(d);
    if (!groups.has(label)) groups.set(label, []);
    groups.get(label).push(item);
  });

  groups.forEach((groupItems, label) => {
    const group = document.createElement('div');
    group.className = 'day-group';

    const dayLabel = document.createElement('div');
    dayLabel.className = 'day-label';
    dayLabel.textContent = label;
    group.appendChild(dayLabel);

    groupItems.forEach(item => group.appendChild(createHistoryItem(item)));
    container.appendChild(group);
  });
}

function createHistoryItem(item) {
  const el = document.createElement('div');
  el.className = 'history-item';
  el.setAttribute('role', 'listitem');

  const favicon = document.createElement('div');
  favicon.className = 'item-favicon';
  if (item.favicon) {
    favicon.innerHTML = `<img src="${escapeAttr(item.favicon)}" alt="" loading="lazy" onerror="this.style.display='none'">`;
  } else {
    favicon.innerHTML = `<svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>`;
  }

  const info = document.createElement('div');
  info.className = 'item-info';

  const title = document.createElement('div');
  title.className = 'item-title';
  title.textContent = item.title || item.url || 'Unknown Page';

  const url = document.createElement('div');
  url.className = 'item-url';
  url.textContent = item.url || '';

  info.appendChild(title);
  info.appendChild(url);

  const time = document.createElement('div');
  time.className = 'item-time';
  time.textContent = formatTime(new Date(item.visitedAt || item.timestamp || Date.now()));

  const delBtn = document.createElement('button');
  delBtn.className = 'item-delete';
  delBtn.setAttribute('aria-label', 'Delete this history item');
  delBtn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>`;
  delBtn.addEventListener('click', async (e) => {
    e.stopPropagation();
    await bb.history.deleteItem(item.id);
    el.style.transition = 'opacity 0.15s, transform 0.15s';
    el.style.opacity = '0';
    el.style.transform = 'translateX(12px)';
    setTimeout(() => el.remove(), 150);
    _allItems = _allItems.filter(i => i.id !== item.id);
  });

  el.addEventListener('click', () => {
    if (item.url) bb.nav.go(item.url);
  });

  el.appendChild(favicon);
  el.appendChild(info);
  el.appendChild(time);
  el.appendChild(delBtn);
  return el;
}

function renderEmpty(msg) {
  document.getElementById('history-container').innerHTML = `
    <div class="empty-state">
      <div class="empty-icon">
        <svg viewBox="0 0 24 24"><path d="M13 3a9 9 0 0 0-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42A8.954 8.954 0 0 0 13 21a9 9 0 0 0 0-18zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/></svg>
      </div>
      <div class="empty-title">No History</div>
      <div class="empty-desc">${msg}</div>
    </div>
  `;
}

async function clearHistory() {
  if (!confirm('Clear all browsing history? This cannot be undone.')) return;
  await bb.history.clear();
  _allItems = [];
  renderEmpty('Your browsing history has been cleared.');
}

document.getElementById('search-input').addEventListener('input', function() {
  clearTimeout(_searchTimer);
  const q = this.value.trim().toLowerCase();
  _searchTimer = setTimeout(async () => {
    if (!q) { render(_allItems); return; }
    try {
      const results = await bb.history.search(q);
      render(results || []);
    } catch {
      render(_allItems.filter(i => (i.title + i.url).toLowerCase().includes(q)));
    }
  }, 200);
});

function getDateLabel(date) {
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const d = new Date(date.getFullYear(), date.getMonth(), date.getDate());
  const diff = Math.round((today - d) / 86400000);
  if (diff === 0) return 'Today';
  if (diff === 1) return 'Yesterday';
  if (diff < 7) return date.toLocaleDateString('en-US', { weekday: 'long' });
  return date.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
}

function formatTime(date) {
  return date.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
}

function escapeAttr(s) {
  return String(s).replace(/"/g, '&quot;').replace(/'/g, '&#39;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// Apply theme
async function applyTheme() {
  if (!bb) return;
  try {
    const s = await bb.settings.get();
    let theme = s.theme || 'dark';
    if (theme === 'system') theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.dataset.theme = theme;
    if (s.accentColor) document.documentElement.style.setProperty('--accent', s.accentColor);
  } catch {}
}

applyTheme().then(loadHistory);
</script>
</body>
</html>
